name: ParkNearMe hydrant lookup
# One-off: W 181st St geometry near Audubon/Amsterdam (OSM + NYC centerline).
on: workflow_dispatch
jobs:
  lookup:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          echo "== catalog =="
          curl -sS "https://api.us.socrata.com/api/catalog/v1?domains=data.cityofnewyork.us&q=centerline&limit=8" | python3 -c "import sys,json;[print(r['resource']['id'],r['resource']['name']) for r in json.load(sys.stdin)['results']]"
          for ep in https://overpass-api.de/api/interpreter https://overpass.kumi.systems/api/interpreter https://maps.mail.ru/osm/tools/overpass/api/interpreter; do
            echo "== osm $ep =="
            curl -sS -m 60 "$ep" --data-urlencode 'data=[out:json][timeout:50];(way["highway"]["name"~"181"](40.8475,-73.9350,40.8500,-73.9290);way["highway"]["name"~"Audubon|Amsterdam"](40.8475,-73.9350,40.8500,-73.9290);node["emergency"="fire_hydrant"](40.8475,-73.9350,40.8500,-73.9290);way["footway"="crossing"](40.8480,-73.9335,40.8495,-73.9310););out geom;' > osm.json
            head -c 300 osm.json; echo
            python3 - <<'PY' && break
          import json
          d=json.load(open('osm.json'))
          for e in d['elements']:
            t=e.get('tags',{})
            g=[(round(p['lat'],6),round(p['lon'],6)) for p in e.get('geometry',[])] or [(e.get('lat'),e.get('lon'))]
            print(e['type'],e['id'],t.get('name'),t.get('highway'),t.get('footway'),t.get('emergency'),t.get('width'),t.get('lanes'),g)
          PY
          done
