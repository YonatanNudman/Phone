name: ParkNearMe hydrant lookup
# One-off: print NYC DEP hydrants and the W 181st St centerline near Audubon/Amsterdam.
on: workflow_dispatch
jobs:
  lookup:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "== hydrants =="
          curl -sS -G "https://data.cityofnewyork.us/resource/5bgh-vtsn.json" \
            --data-urlencode '$where=within_box(the_geom, 40.8515, -73.9345, 40.8480, -73.9280)' \
            --data-urlencode '$limit=200' | python3 -c "import sys,json;d=json.load(sys.stdin);print(len(d));[print(json.dumps(x)) for x in d]"
          echo "== osm =="
          curl -sS https://overpass-api.de/api/interpreter --data-urlencode 'data=[out:json];way["name"~"181st Street"](40.848,-73.935,40.852,-73.928);out geom;node(w);way(bn)["name"~"Audubon|Amsterdam|St. Nicholas"];out tags;' | python3 -c "
          import sys,json
          d=json.load(sys.stdin)
          for e in d['elements']:
            print(e['type'], e.get('id'), e.get('tags',{}).get('name'), [(round(g['lat'],6),round(g['lon'],6)) for g in e.get('geometry',[])])"
          echo "== intersections =="
          curl -sS https://overpass-api.de/api/interpreter --data-urlencode 'data=[out:json];way["name"="West 181st Street"](40.848,-73.935,40.852,-73.928)->.a;way["name"~"^(Audubon Avenue|Amsterdam Avenue)$"](40.846,-73.936,40.854,-73.926)->.b;node(w.a)->.na;node(w.b)->.nb;node.na.nb;out;way(bn.na);out tags;' | python3 -c "
          import sys,json
          for e in json.load(sys.stdin)['elements']: print(e['type'], e.get('lat'), e.get('lon'), e.get('tags',{}).get('name'))"
