name: ParkNearMe hydrant lookup
# One-off: W 181st St geometry near Audubon/Amsterdam (NYC centerline + OSM).
on: workflow_dispatch
jobs:
  lookup:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          echo "== centerline =="
          curl -sS -G "https://data.cityofnewyork.us/resource/inkn-q76z.json" \
            --data-urlencode '$where=within_box(the_geom, 40.8500, -73.9345, 40.8475, -73.9290)' \
            --data-urlencode '$limit=100' > cl.json
          python3 - <<'PY'
          import json
          d=json.load(open('cl.json'))
          if isinstance(d,dict): print(d); raise SystemExit
          print('keys', sorted(d[0].keys()) if d else None)
          for r in d:
            name=r.get('full_stree') or r.get('full_street_name') or r.get('stname_lab') or r.get('st_name')
            g=r.get('the_geom',{}).get('coordinates')
            print(name, r.get('st_width') or r.get('streetwidt'), r.get('l_low_hn'), r.get('r_low_hn'), json.dumps(g))
          PY
          echo "== osm =="
          curl -sS -m 90 -A "parknearme-lookup/1.0 (github actions)" https://overpass-api.de/api/interpreter --data-urlencode 'data=[out:json][timeout:60];(way["highway"]["name"~"181"](40.8475,-73.9350,40.8500,-73.9290);way["highway"]["name"~"Audubon|Amsterdam"](40.8475,-73.9350,40.8500,-73.9290);node["emergency"="fire_hydrant"](40.8475,-73.9350,40.8500,-73.9290);way["footway"="crossing"](40.8480,-73.9335,40.8495,-73.9310););out geom;' > osm.json
          head -c 200 osm.json; echo
          python3 - <<'PY'
          import json
          d=json.load(open('osm.json'))
          for e in d['elements']:
            t=e.get('tags',{})
            g=[(round(p['lat'],6),round(p['lon'],6)) for p in e.get('geometry',[])] or [(e.get('lat'),e.get('lon'))]
            print(e['type'],e['id'],t.get('name'),t.get('highway'),t.get('footway'),t.get('emergency'),t.get('width'),t.get('lanes'),g)
          PY
