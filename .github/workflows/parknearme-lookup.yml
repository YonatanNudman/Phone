name: ParkNearMe street cleaning data
# Fetches NYC street-cleaning signs near home and commits them (runs where NYC Open Data is reachable).
on: workflow_dispatch
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install pyproj
      - run: python3 parknearme/scripts/fetch_street_cleaning.py parknearme/data/street-cleaning.json
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add parknearme/data/street-cleaning.json
          git commit -m "Street-cleaning signs near home [skip ci]" && git push || echo "no changes"
